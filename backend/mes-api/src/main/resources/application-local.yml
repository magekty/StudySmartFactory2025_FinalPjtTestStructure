server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3307/globalmed?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC
    username: mes_user
    password: mes_pwd
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

logging:
  level:
    root: INFO

app:
  security:
    jwt:
      secret: 0123456789abcdef0123456789abcdef
      ttl-minutes: 30

erp:
  base-url: http://localhost:8081
  api-key: change-me-demo-key
  shadow:
    enabled: true
    work-orders: false
    performances: false
    backflush: true
    cost: true

outbox:
  worker:
    batch-size: 100
    delay-ms: 1000
    max-retry: 5
    backoff-seq: 60000,300000,900000,3600000,21600000