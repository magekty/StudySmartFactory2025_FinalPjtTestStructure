version: '3.9'
services:
  mysql:
    image: mysql:8.4
    container_name: erp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: erp_mvp
      TZ: UTC
    ports:
      - "3308:3306"
    command: ["--default-authentication-plugin=mysql_native_password", "--explicit_defaults_for_timestamp=1"]
    volumes:
      - db_data:/var/lib/mysql
volumes:
  db_data: